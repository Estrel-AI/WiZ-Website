services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wiiz-website-test
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=testing
      - MYSQL_HOST=db
    depends_on:
      - db
    volumes:
      - app_assets:/app/assets
      - app_public_uploads:/app/public/uploads
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: wiiz-website-test-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wizz_db}
      - MYSQL_USER=${MYSQL_USER:-wizz_db_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Wizz@321}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
  app_assets:
  app_public_uploads:
